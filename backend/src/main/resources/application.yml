spring:
  application:
    name: cake-platform-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cake_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}

  jpa:
    hibernate:
      ddl-auto: validate # We use Flyway for migrations
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    detect-encoding: true

  # Allow uploads up to 5MB (controller validates at 5MB; Spring Boot default is 1MB)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in ms

app:
  business:
    default-timezone: ${APP_TIMEZONE:Asia/Kolkata}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:secret_placeholder}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:webhook_secret_placeholder}
