spring:
  application:
    name: cake-platform-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cake_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:20000}

  jpa:
    hibernate:
      ddl-auto: validate # We use Flyway for migrations
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    detect-encoding: true

  # Allow uploads up to 25MB for review videos (controller validates images at 5MB and videos at 25MB)
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  jackson:
    serialization:
      fail-on-empty-beans: false

