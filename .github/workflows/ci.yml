name: CakeStore CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn clean verify

      - name: Build Docker image
        run: docker build -t cakestore-api:${{ github.sha }} ./backend


  push-image:
    name: Push Image to Azure Container Registry
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name crcakestoreprod

      - name: Build Docker image
        run: |
          docker build \
            -t crcakestoreprod.azurecr.io/cakestore-api:${{ github.sha }} \
            -t crcakestoreprod.azurecr.io/cakestore-api:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push crcakestoreprod.azurecr.io/cakestore-api:${{ github.sha }}
          docker push crcakestoreprod.azurecr.io/cakestore-api:latest

      - name: Verify image in ACR
        run: |
          az acr repository show \
            --name crcakestoreprod \
            --image cakestore-api:${{ github.sha }} \
            --output table